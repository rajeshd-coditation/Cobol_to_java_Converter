services:
  cobol-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobol-converter
    ports:
      - "3001:3000"
    volumes:
      # CardDemo COBOL sample app — available inside container as /cobol-source/carddemo
      - ./opensourcecobol4j/carddemo-app:/cobol-source/carddemo:ro
      # Persistent conversion output + checkpoints — survives rebuilds
      - ./conversion-data:/app/conversion-data
      # Live reload — changes apply after: docker-compose restart cobol-converter
      - ./opensourcecobol4j/tools/web-ui/public:/app/tools/web-ui/public
      - ./opensourcecobol4j/tools/web-ui/src:/app/tools/web-ui/src
      - ./opensourcecobol4j/tools/web-ui/server.js:/app/tools/web-ui/server.js
      - ./opensourcecobol4j/tools/web-ui/azureAgent.js:/app/tools/web-ui/azureAgent.js
    environment:
      COBOL_DATA_DIR: /app/conversion-data
    env_file:
      - .env
    restart: unless-stopped
